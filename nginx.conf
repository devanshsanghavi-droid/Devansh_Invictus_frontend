events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Extract clean path from $request_uri (strips query params)
    # $request_uri is never modified by try_files, unlike $uri
    map $request_uri $canonical_path {
        ~^([^?]*)  $1;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Enable sub_filter for injecting canonical tags into HTML responses
        sub_filter_once on;
        sub_filter_types text/html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.gpteng.co https://ddwl4m2hdecbv.cloudfront.net https://assets.apollo.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://staging.trilio.ai https://ddwl4m2hdecbv.cloudfront.net https://assets.apollo.io https://assets.channeliq.ai https://4x879wbh.api.sanity.io https://4x879wbh.apicdn.sanity.io https://cdn.sanity.io" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Redirect trailing slashes to non-trailing (except root /)
        # Prevents duplicate content: /blog/ and /blog are treated as different URLs
        rewrite ^(.+)/$ $1 permanent;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle React Router - serve index.html for all routes
        # Inject canonical tag server-side so crawlers see it before JS runs
        location / {
            try_files $uri $uri/ /index.html;

            # Inject canonical URL using $canonical_path (derived from $request_uri)
            # $request_uri preserves the original path even after try_files rewrites $uri to /index.html
            sub_filter '<!-- CANONICAL_PLACEHOLDER -->' '<link rel="canonical" href="https://invictusdata.ai$canonical_path" />';
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
} 